name: parlance_generator
description: "Makes parlance's typed words from a module's abstract Dart class: the enums of its states, commands, queries and facts, with their shapes."
version: 0.1.0
resolution: workspace
repository: https://github.com/nogipx/parlance
issue_tracker: https://github.com/nogipx/parlance/issues
topics:
  - codegen
  - source-gen

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  analyzer: '>=9.0.0 <11.0.0'
  build: ^4.0.4
  dart_style: ^3.1.3
  parlance: ^0.1.0
  pub_semver: ^2.2.0
  source_gen: ^4.2.0

dev_dependencies:
  build_runner: ^2.11.1
  build_test: ^3.5.7
  json_annotation: ^4.12.0
  json_serializable: ^6.12.0
  test: ^1.25.0
