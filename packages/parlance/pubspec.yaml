name: parlance
description: "A shared language for app parts that do not know each other: owned states, commands and facts, with rights, causes and links."
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  clock: ^1.1.0
  rpc_dart: ^6.3.0
  # The binary's transport to a host; the libraries do not import it.
  rpc_dart_socket: ^0.1.0

executables:
  parlance-mcp: parlance_mcp

dev_dependencies:
  build_runner: ^2.11.1
  fake_async: ^1.3.0
  # The house example's words are generated; a dev cycle, back to here.
  parlance_generator: any
  rpc_dart_generator: ^0.6.0
  test: ^1.25.0
