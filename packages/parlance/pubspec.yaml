name: parlance
description: "A shared language for app parts that do not know each other: owned states, commands, queries and facts, with rights and causes."
version: 0.1.0
resolution: workspace
repository: https://github.com/nogipx/parlance
issue_tracker: https://github.com/nogipx/parlance/issues
topics:
  - messaging
  - modularity
  - agents
  - iot

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  clock: ^1.1.0
  # A schema's fingerprint (SPEC §25.4).
  crypto: ^3.0.0
  rpc_dart: ^7.0.0

dev_dependencies:
  build_runner: ^2.11.1
  fake_async: ^1.3.0
  # The house example's words are generated; a dev cycle, back to here.
  parlance_generator: ^0.1.0
  rpc_dart_generator: ^0.7.0
  test: ^1.25.0
