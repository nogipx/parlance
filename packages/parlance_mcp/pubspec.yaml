name: parlance_mcp
description: "Inspect running Parlance apps, discover their tools, and query their rpc_dart logs through one MCP collector."
version: 0.4.1
resolution: workspace
repository: https://github.com/nogipx/parlance
issue_tracker: https://github.com/nogipx/parlance/issues
topics:
  - mcp
  - agents

environment:
  sdk: ">=3.10.1 <4.0.0"

dependencies:
  parlance: ^0.4.0
  rpc_dart: ^7.2.0
  rpc_dart_log: ^0.4.1
  rpc_dart_websocket: ^0.6.0
  args: ^2.6.0

executables:
  parlance-mcp: parlance_mcp

dev_dependencies:
  build_runner: ^2.11.1
  # The example's words are generated.
  parlance_generator: ^0.4.0
  test: ^1.25.0
