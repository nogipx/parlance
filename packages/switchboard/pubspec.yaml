name: switchboard
description: "A registry of states, commands and facts that participants share without knowing each other, links between them (reactions, bindings, constraints, interceptions), and the registry over rpc_dart."
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.1

dependencies:
  clock: ^1.1.0
  rpc_dart: ^6.3.0

dev_dependencies:
  build_runner: ^2.11.1
  fake_async: ^1.3.0
  rpc_dart_generator: ^0.6.0
  test: ^1.25.0
