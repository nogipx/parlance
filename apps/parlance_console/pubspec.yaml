name: parlance_console
description: "Desktop console for live Parlance hosts, logs and recorded journals."
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.1

dependencies:
  material_ui: ^1.8.0
  flutter:
    sdk: flutter
  desktop_drop: ^0.6.0
  file_picker: ^10.0.0
  http: ^1.2.0
  parlance: any
  parlance_journal: any
  parlance_mcp: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
