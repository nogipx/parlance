name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Workspace-wide analyze + compatibility with the current release line.
  # Before 1.0, a new minor may break the API (see MAINTAINING.md).
  lint:
    name: "Analyze & frozen surface"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Resolve workspace
        run: fvm dart pub get
      - name: Analyze (all packages)
        run: melos run analyze
      - name: Public streaming API boundaries
        run: fvm dart run tool/public_stream_api_test.dart
      - name: Release compatibility policy checks
        run: fvm dart run tool/frozen_surface_test.dart
      - name: Public API vs the latest compatible release tag
        run: melos run frozen

  # Dart tests across the workspace. journal_viewer is a Flutter app and has
  # its own job; it needs `flutter test`.
  test:
    name: "Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Resolve workspace
        run: fvm dart pub get
      - name: Run tests
        run: melos run test

  # journal_viewer is a Flutter app: its tests need `flutter test` (dart:ui).
  viewer:
    name: "journal_viewer (Flutter)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Resolve workspace
        run: fvm dart pub get
      - name: Run journal_viewer tests
        run: melos run test:viewer

  # Validate that the publishable packages stay publishable. Catches
  # path-dep / resolution / versioning regressions early; also enforces the
  # release rule that the tree must be clean (a fresh checkout always is).
  publish-dry:
    name: "Publish dry-run"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Resolve workspace
        run: fvm dart pub get
      - name: melos publish --dry-run
        run: melos run publish:dry
